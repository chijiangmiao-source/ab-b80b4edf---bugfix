services:
  night-planner:
    build: .
    image: night-planner:latest
    # Host-side published port is configurable through the environment,
    # e.g. `API_HOST_PORT=9090 docker compose up`. The container-internal
    # listening port is independently configurable via API_PORT.
    ports:
      - "${API_HOST_PORT:-8080}:${API_PORT:-8080}"
    environment:
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8080}
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-1048576}
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  verify:
    build: .
    image: night-planner:latest
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: ["python", "-m", "unittest", "discover", "-s", "tests"]
    profiles: ["verify"]
